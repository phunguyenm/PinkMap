name: Collect traffic data

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (GitHub uses UTC time)
  workflow_dispatch:         # lets you start it by hand with a button

permissions:
  contents: write            # lets the robot save the new rows into the repo

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install requests

      - name: Ask Mapbox and save rows
        run: python collect.py
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

      - name: Save the new rows to the repo
        run: |
          git config user.name "pinkmap-bot"
          git config user.email "pinkmap-bot@users.noreply.github.com"
          git add data/auto_collected.csv
          git commit -m "Add new traffic data" || echo "nothing to commit"
          git pull --rebase
          git push

